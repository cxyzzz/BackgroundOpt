name: build-apk

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      branch:
        description: '要编译的分支（留空则用当前触发分支）'
        required: false
        default: ''
        type: string
      publish_release:
        description: '是否发布到 GitHub Releases'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 手动触发时用输入的分支；留空或 push 触发时用当前 ref
          ref: ${{ inputs.branch || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      # 每种触发方式都上传 artifact（便于在 Actions 页面下载）
      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: bgopt-hyperos4-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 发布到 Releases：push 时总是发布；手动触发时按 publish_release 开关
      - name: Publish to Releases
        if: ${{ github.event_name == 'push' || inputs.publish_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BackgroundOpt HyperOS4 build ${{ github.run_number }}
          body: |
            ## 自动构建产物
            - Commit: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - 构建号: #${{ github.run_number }}
            - 触发方式: `${{ github.event_name }}`
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
