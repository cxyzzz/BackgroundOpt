name: build-apk

on:
  push:
    branches: [ hyperos4-adapt ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      apks: ${{ steps.collect.outputs.apks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline.zip
          mv cmdline-tools latest
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Collect APK files
        id: collect
        run: |
          cd app/build/outputs/apk/release
          apks=$(ls *.apk | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apks=$apks" >> $GITHUB_OUTPUT

      # 构建产物发布到 GitHub Releases（每次构建一个独立 Release，标记为预发布）
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: BackgroundOpt HyperOS4 build ${{ github.run_number }}
          body: |
            ## 自动构建产物
            - Commit: `${{ github.sha }}`
            - 分支: `${{ github.ref_name }}`
            - 构建号: #${{ github.run_number }}
            - 触发方式: `${{ github.event_name }}`
          files: app/build/outputs/apk/release/*.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 暂存构建产物，供下方 matrix job 逐个下载后单独上传成一个个 artifact
      - name: Stash built APKs (for per-file artifact upload)
        uses: actions/upload-artifact@v4
        with:
          name: _apks-stash
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  # 每个 apk 单独一个 artifact（一个一个文件，而不是打包成一个 zip）
  upload-apk-artifacts:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        apk: ${{ fromJSON(needs.build.outputs.apks) }}
    steps:
      - name: Download built APKs
        uses: actions/download-artifact@v4
        with:
          name: _apks-stash

      - name: Upload ${{ matrix.apk }} as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.apk }}
          path: ${{ matrix.apk }}
